<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Versão 4 do tailwind esta meio instavel ainda, foi preciso mudar a classe .dark manualmente -->
    <link rel="stylesheet" href="assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/css">
      :root {
        --background: #ffffff;
        --foreground: #000000;
      }
      .dark {
        --background: #353434;
        --foreground: #ffffff;
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
      }
    </style>
    <title>NovelsCenter</title>
  </head>

  <body
    class="container mx-auto bg-white dark:bg-black text-black dark:text-white transition-all duration-200"
  >
    <header class="flex justify-between items-center mt-3">
      <div class="text-2xl">NovelsCenter</div>
      <div>
        <form action="">
          <input
            class="border border-gray-700 dark:bg-gray-300 rounded-md w-70 h-8 text-base outline-gray-700 text-black"
            type="text"
            id="inTitulo"
          />
        </form>
      </div>
      <div class="flex">
        <div class="mr-15 cursor-pointer p-1" id="theme">
          <svg
            class="w-8 -m-1 fill-black dark:fill-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18"
            />
          </svg>
        </div>
        <div
          class="flex flex-col cursor-pointer p-1 rounded-md transition-all hover:opacity-70 hover:bg-gray-600"
          id="filterNovels"
        >
          <div class="w-9 h-1 bg-gray-700 mb-2"></div>
          <div class="w-9 h-1 bg-gray-700 mb-2"></div>
          <div class="w-9 h-1 bg-gray-700"></div>
        </div>
      </div>
    </header>
    <div id="fade" class="hide">
      <div id="modal" class="hide">
        <div class="p-3" id="modal-header">
          <h1 id="modal-title"></h1>
          <button class="mb-5" id="btn-fecharModal">Fechar</button>
        </div>

        <div id="modal-body">
          <!--Infos gerais da novel clicada-->
          <div
            id="modal-infoNovel"
            class="flex flex-col md:flex-row gap-5 my-5"
          >
            <img id="modalImg" src="" alt="" />
            <div id="infoNovel" class="flex flex-col mx-auto"></div>
          </div>

          <!--BFS o sistema de recomendação de novels baseadas pelo genero da novel clicada-->
          <div id="modal-recNovels" class="mt-10">
            <h3>Novels relacionadas</h3>
            <div id="bfsCards" class="grid grid-cols-3 gap-2 rounded-md"></div>
          </div>

          <!--Mini seção de comentarios para resenha dos usuarios sobre a novel clicada-->
          <div id="modal-comments" class="mt-10">
            <h3>Comentarios</h3>
          </div>
        </div>
      </div>
    </div>
    <main
      class="grid grid-cols-1 gap-3 md:grid-cols-3 mt-20"
      id="novelsCards"
    ></main>
    <script src="script.js" defer></script>
  </body>
</html>
